<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>New Tab</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="grid-bg"></div>

  <!-- TOP-RIGHT ACTIONS -->
  <div class="top-actions">
    <!-- SETTINGS BUTTON -->
    <button class="top-btn" id="settings-btn" title="Settings" aria-label="Open settings">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="1.5"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </button>
    <!-- GMAIL SHORTCUT -->
    <a class="top-btn" id="gmail-shortcut" href="https://mail.google.com" target="_blank" rel="noopener"
      title="Gmail">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M3 6.5C3 5.67157 3.67157 5 4.5 5H19.5C20.3284 5 21 5.67157 21 6.5V17.5C21 18.3284 20.3284 19 19.5 19H4.5C3.67157 19 3 18.3284 3 17.5V6.5Z"
          stroke="currentColor" stroke-width="1.5" />
        <path d="M4 6.5L12 13L20 6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </a>
  </div>

  <main class="wrap">

    <!-- HERO: clock -->
    <header class="hero">
      <p class="greeting" id="greeting">// good morning, developer</p>
      <div class="clock" id="clock">
        <span id="clock-time">00:00<span class="cursor">:</span>00</span>
      </div>
      <p class="gitline" id="gitline">loading…</p>
    </header>

    <!-- SEARCH -->
    <form class="searchbar" id="searchbar" autocomplete="off">
      <span class="chevron">&gt;</span>
      <input type="text" id="search-input" placeholder="search the web <3" spellcheck="false" />
      <button type="submit" class="search-go" title="search">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6" />
          <path d="M20 20L16.5 16.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </button>
    </form>

    <!-- PANELS -->
    <section class="panels">

      <!-- TODO -->
      <div class="panel" id="panel-todo">
        <div class="panel-head">
          <span class="prompt">$ todo --list</span>
          <span class="count" id="todo-count">0 open</span>
        </div>
        <form class="todo-form" id="todo-form" autocomplete="off">
          <span class="chevron">&gt;</span>
          <input type="text" id="todo-input" placeholder="add a task, hit enter" maxlength="140" spellcheck="false" />
        </form>
        <ul class="todo-list" id="todo-list"></ul>
      </div>

      <!-- SHORTCUTS -->
      <div class="panel" id="panel-links">
        <div class="panel-head">
          <span class="prompt">~/shortcuts</span>
          <button class="add-btn" id="link-add" title="add shortcut">+ new</button>
        </div>
        <div class="links-grid" id="links-grid"></div>
      </div>

      <!-- STICKY NOTES -->
      <div class="panel" id="panel-notes">
        <div class="panel-head">
          <span class="prompt">// sticky-notes</span>
          <button class="add-btn" id="note-add" title="add note">+ new</button>
        </div>
        <div class="notes-board" id="notes-board"></div>
      </div>

    </section>

    <footer class="foot">
      <span id="quote">// keep building</span>
    </footer>

  </main>

  <!-- SHORTCUT EDIT/ADD MODAL -->
  <div class="modal-overlay" id="link-modal-overlay">
    <div class="modal" id="link-modal">
      <p class="modal-title" id="link-modal-title">// new shortcut</p>
      <label class="modal-label" for="link-name-input">shortcut name</label>
      <input type="text" id="link-name-input" class="modal-input" placeholder="e.g. Figma" maxlength="40"
        spellcheck="false" />
      <label class="modal-label" for="link-url-input">shortcut link</label>
      <input type="text" id="link-url-input" class="modal-input" placeholder="e.g. figma.com" maxlength="200"
        spellcheck="false" />
      <div class="modal-actions">
        <button class="modal-btn cancel" id="link-modal-cancel">cancel</button>
        <button class="modal-btn save" id="link-modal-save">save</button>
      </div>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div class="modal-overlay" id="settings-overlay">
    <div class="modal settings-modal" id="settings-modal">
      <div class="settings-header">
        <p class="modal-title">// settings</p>
        <button class="settings-close" id="settings-close" aria-label="Close settings">✕</button>
      </div>

      <p class="settings-section-label">panels</p>
      <div class="settings-toggles">
        <label class="toggle-row" for="toggle-todo">
          <span class="toggle-name">$ todo --list</span>
          <span class="toggle-switch">
            <input type="checkbox" id="toggle-todo" checked />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </span>
        </label>
        <label class="toggle-row" for="toggle-shortcuts">
          <span class="toggle-name">~/shortcuts</span>
          <span class="toggle-switch">
            <input type="checkbox" id="toggle-shortcuts" checked />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </span>
        </label>
        <label class="toggle-row" for="toggle-notes">
          <span class="toggle-name">// sticky-notes</span>
          <span class="toggle-switch">
            <input type="checkbox" id="toggle-notes" checked />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </span>
        </label>
      </div>

      <p class="settings-section-label">background theme</p>
      <div class="theme-swatches" id="theme-swatches">
        <button class="swatch" data-theme="midnight" title="Midnight Blue" style="background:#0d1420"></button>
        <button class="swatch" data-theme="abyss"    title="Deep Abyss"   style="background:#0a0e17"></button>
        <button class="swatch" data-theme="forest"   title="Dark Forest"  style="background:#0d1a12"></button>
        <button class="swatch" data-theme="plum"     title="Plum Dark"    style="background:#130d1e"></button>
        <button class="swatch" data-theme="ember"    title="Ember"        style="background:#1a0d0a"></button>
        <button class="swatch" data-theme="slate"    title="Slate"        style="background:#111418"></button>
        <button class="swatch" data-theme="ocean"    title="Ocean"        style="background:#091421"></button>
        <button class="swatch" data-theme="ash"      title="Ash"          style="background:#0a0a0a"></button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
